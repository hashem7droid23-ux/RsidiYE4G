name: Build Yemen 4G APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK Tools
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV

          # Add pre-installed cmdline-tools and platform-tools to PATH
          for bin_dir in \
            "$ANDROID_ROOT/cmdline-tools/latest/bin" \
            "$ANDROID_ROOT/cmdline-tools/16.0/bin" \
            "$ANDROID_ROOT/cmdline-tools/12.0/bin" \
            "$ANDROID_ROOT/cmdline-tools/9.0/bin" \
            "$ANDROID_ROOT/tools/bin" \
            "$ANDROID_ROOT/platform-tools"; do
            if [ -d "$bin_dir" ]; then
              echo "$bin_dir" >> $GITHUB_PATH
              echo "Added $bin_dir to PATH"
            fi
          done

      - name: Ensure sdkmanager is available
        run: |
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager not found in standard paths, downloading official command-line tools..."
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSLo /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extracted
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdline-tools-extracted/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
            echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          fi

      - name: Verify and Install Android SDK Packages
        run: |
          command -v sdkmanager
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Cache Debug Keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: ${{ runner.os }}-debug-keystore-v2

      - name: Generate Debug Keystore if missing
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore matching signingConfigs..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yemen-4g-hashem-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Publish Release APK
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: yemen-4g-hashem-debug-apk
          path: apk-artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2-${{ github.run_number }}
          name: "يمن فورجي - النسخة التجريبية ${{ github.run_number }}"
          body: |
            نسخة APK تجريبية مبنية تلقائياً عبر GitHub Actions.
            - التطبيق: استعلام رصيد مودميات يمن فورجي
            - برمجة وتصميم: المهندس هاشم القديمي
            - رقم البناء: ${{ github.run_number }}
          files: apk-artifact/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
