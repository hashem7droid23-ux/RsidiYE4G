name: Build Yemen 4G APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Initialize Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Verify and Install Android SDK Packages
        run: |
          command -v sdkmanager
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Cache Debug Keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: ${{ runner.os }}-debug-keystore-v2

      - name: Generate Debug Keystore if missing
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore matching signingConfigs..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yemen-4g-hashem-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Publish Release APK
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: yemen-4g-hashem-debug-apk
          path: apk-artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-${{ github.run_number }}
          name: "يمن فورجي - النسخة التجريبية ${{ github.run_number }}"
          body: |
            نسخة APK تجريبية مبنية تلقائياً عبر GitHub Actions.
            - التطبيق: استعلام رصيد مودميات يمن فورجي
            - برمجة وتصميم: المهندس هاشم القديمي
            - رقم البناء: ${{ github.run_number }}
          files: apk-artifact/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
