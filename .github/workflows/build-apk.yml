name: Build Yemen 4G APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Cache Debug Keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: ${{ runner.os }}-debug-keystore-v1

      - name: Generate Debug Keystore if missing
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore for local debug builds..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradlew Executable
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 9.3.1
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yemen-4g-hashem-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
